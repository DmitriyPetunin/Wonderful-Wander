name: CI

on:
  pull_request:
    branches: [ master, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Создаем google-services.json из FIREBASE_SERVICE_ACCOUNT
      - name: Create google-services.json from FIREBASE_SERVICE_ACCOUNT
        run: |
          mkdir -p app/src/debug
          
          echo "Декодирую google-services.json из FIREBASE_SERVICE_ACCOUNT..."
          
          # Убираем все пробелы и переносы из base64
          CLEAN_BASE64=$(echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | tr -d '[:space:]')
          
          echo "Длина base64: ${#CLEAN_BASE64}"
          echo "Первые 50 символов: ${CLEAN_BASE64:0:50}"
          
          # Декодируем base64
          if echo "$CLEAN_BASE64" | base64 --decode > app/src/debug/google-services.json; then
            echo "Файл создан успешно"
          
            # Проверяем что файл не пустой
            FILE_SIZE=$(wc -c < app/src/debug/google-services.json)
            echo "Размер файла: $FILE_SIZE байт"
          
            if [ $FILE_SIZE -gt 100 ]; then
              echo "Файл имеет достаточный размер"
          
              # Проверяем JSON валидность (если установлен jq)
              if command -v jq &> /dev/null; then
                if jq empty app/src/debug/google-services.json 2>/dev/null; then
                  echo "JSON валиден"
                else
                  echo "JSON невалиден, но продолжаем..."
                  echo "Первые 200 символов файла:"
                  head -c 200 app/src/debug/google-services.json
                  echo ""
                fi
              fi
            else
              echo "Ошибка: Файл слишком маленький ($FILE_SIZE байт)"
              echo "Содержимое файла:"
              cat app/src/debug/google-services.json
              exit 1
            fi
          else
            echo "Ошибка декодирования base64!"
            echo "Проверьте, что в секрете FIREBASE_SERVICE_ACCOUNT правильный base64"
            exit 1
          fi

      # 2. Создаем local.properties с API ключами
      - name: Create local.properties with API keys
        run: |
          echo "Создаю local.properties..."
          
          cat > local.properties << EOF
          # API ключи для CI
          GEO_CODER_API_KEY=${{ secrets.GEO_CODER_API_KEY }}
          MAPKIT_API_KEY=${{ secrets.MAPKIT_API_KEY }}
          
          # Android SDK путь (обязательно для сборки)
          sdk.dir=/usr/local/lib/android/sdk
          EOF
          
          echo "local.properties создан"
          echo "Содержимое:"
          cat local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Установите Android SDK (важно!)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest
            emulator

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. Запускаем сборку с отладочной информацией
      - name: Build with debug info
        run: |
          echo "Начинаем сборку"
          ./gradlew assembleDebug --stacktrace --info || \
          (echo "Первая сборка упала, пробуем с clean..." && \
           ./gradlew clean assembleDebug --stacktrace)

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      # 5. Firebase App Distribution
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Login to Firebase with service account
        run: |
          # Создаем файл сервисного аккаунта из того же секрета
          echo "Создаю firebase-service-account.json..."
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > firebase-service-account.json
          
          # Проверяем файл
          if [ -s firebase-service-account.json ]; then
            echo "Файл сервисного аккаунта создан ($(wc -c < firebase-service-account.json) байт)"
            echo "Логинюсь в Firebase..."
            firebase login:ci --no-localhost --keyfile firebase-service-account.json
          else
            echo "Файл сервисного аккаунта пустой, пропускаю Firebase login"
          fi

      - name: Upload APK to Firebase App Distribution
        run: |
          # Проверяем что APK существует
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK найден, загружаю в Firebase..."
            firebase appdistribution:distribute \
              app/build/outputs/apk/debug/app-debug.apk \
              --app "${{ secrets.FIREBASE_APP_ID }}" \
              --groups "testers" \
              --release-notes "CI Build - ${{ github.sha }}"
          else
            echo "APK не найден, пропускаю загрузку"
            echo "Поиск APK файлов:"
            find app/build/outputs -name "*.apk" 2>/dev/null || echo "APK не найдены"
          fi