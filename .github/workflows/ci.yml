name: CI

on:
  pull_request:
    branches: [ master, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create google-services.json from secret
        run: |
          mkdir -p app/src/debug
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/src/debug/google-services.json
          echo "google-services.json created"

      - name: Create local.properties for CI
        run: |
          echo "GEO_CODER_API_KEY=${{ secrets.GEO_CODER_API_KEY }}" > local.properties
          echo "sdk.dir=/usr/local/lib/android/sdk" >> local.properties
          echo "local.properties created"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Detekt
        run: |
          ./gradlew detekt --continue || echo " Detekt found issues, but continuing build..."

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Login to Firebase
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > ./firebase-service-account.json
          firebase login:ci --no-localhost --keyfile ./firebase-service-account.json

      - name: Upload APK to Firebase App Distribution
        run: |
          firebase appdistribution:distribute \
            app/build/outputs/apk/debug/app-debug.apk \
            --app ${{ secrets.FIREBASE_APP_ID }} \
            --groups testers \
            --release-notes "Build from PR #${{ github.event.pull_request.number }} by @${{ github.actor }}"