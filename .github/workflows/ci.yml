name: CI

on:
  pull_request:
    branches: [ master, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create required files
        run: |
          # google-services.json
          mkdir -p app/src/debug
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > app/src/debug/google-services.json
          
          # local.properties
          echo "GEO_CODER_API_KEY=${{ secrets.GEO_CODER_API_KEY }}" > local.properties
          echo "MAPKIT_API_KEY=${{ secrets.MAPKIT_API_KEY }}" >> local.properties
          echo "sdk.dir=/usr/local/lib/android/sdk" >> local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Используйте предустановленный SDK
      - name: Accept Android licenses
        run: |
          # Принимаем все лицензии автоматически
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          echo "Android licenses accepted"

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Run tests
        run: ./gradlew testDebugUnitTest