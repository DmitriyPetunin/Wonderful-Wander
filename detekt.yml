build:
  maxIssues: 1000
  weights: {}
  excludeCorrectable: true

autoCorrect: true

processors:
  active: true
  exclude:
    - 'FunctionCountProcessor'
    - 'PropertyCountProcessor'
    - 'ClassCountProcessor'
    - 'PackageCountProcessor'
    - 'KtFileCountProcessor'

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'

output-reports:
  active: true
  exclude:
    - 'TxtOutputReport'
    - 'XmlOutputReport'

style:
  active: true
  MagicNumber:
    active: false
  NewLineAtEndOfFile:
    active: true
    autoCorrect: true
  MaxLineLength:
    active: true
    maxLineLength: 120
    autoCorrect: false
  FunctionNaming:
    active: true
    excludeClassPattern: '^$'
  PackageNaming:
    active: false

formatting:
  active: false

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - 'ArrayIndexOutOfBoundsException'
      - 'Error'
      - 'Exception'
      - 'IllegalMonitorStateException'
      - 'NullPointerException'
      - 'IndexOutOfBoundsException'
      - 'RuntimeException'
      - 'Throwable'
  PrintStackTrace:
    active: true
  InstanceOfCheckForException:
    active: true

complexity:
  active: true
  LargeClass:
    active: true
    threshold: 600
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 6
  TooManyFunctions:
    active: true
    thresholdInFiles: 11
    thresholdInClasses: 11
    thresholdInInterfaces: 11
    thresholdInObjects: 11
    thresholdInEnums: 11

comments:
  active: true
  CommentOverPrivateFunction:
    active: false
  CommentOverPrivateProperty:
    active: false

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '^(_|(ignore|expected).*)$'

potential-bugs:
  active: true
  UnusedPrivateMember:
    active: false